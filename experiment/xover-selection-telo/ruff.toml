# Lint policy for this study only. Kept here rather than in the repo's pyproject.toml because the
# directory is an experiment on a branch that is never merged.
extend = "../../pyproject.toml"

[lint.per-file-ignores]
"tests/*.py" = [
    "S101",     # asserts are how a test asserts
    "PLR2004",  # a magic value in an assertion is the expected value
    "SLF001",   # tests may reach into a module's internals
    "D103",     # a test name says what it checks
]
"*.py" = [
    "T201",     # scripts report progress by printing
    "PLC0415",  # desdeo and pflacco are imported lazily where noted
]
# Snakemake injects a `snakemake` object into every script it runs through the `script:` directive.
"scripts/*.py" = ["F821"]
"envs/ela/*.py" = ["F821"]
